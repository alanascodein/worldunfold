      egyptian: 'Egyptian priests watched the circumpolar stars because they never set — they called them the "Imperishable Ones." They believed these undying stars were souls of kings who had achieved immortality. Temples were sometimes aligned to their rising and setting.',
      filipino: 'The North Star was known to Filipino navigators as a critical orientation point. Malay and Filipino sailors called it the "navel of the sky" — the still point around which all other stars revolve, like a great wheel with one pin at the centre.',
      science: 'Brightest star: Polaris (magnitude 2.0, about 433 light-years away). Polaris is not exactly at the North Pole — it is off by about 0.7 degrees. In 3,000 years, a different star called Gamma Cephei will become the North Star due to Earth\'s wobble.',
      story: 'Everything spins.\n\nThe whole sky — ten thousand stars — wheels overhead from east to west, night after night, year after year. They rise. They set. They rise again.\n\nEverything spins.\n\nExcept one.\n\nAt the very tip of the Little Bear\'s tail, one small star stands perfectly still. It does not rise. It does not set. While the great constellations wheel around it like a carousel, Polaris simply watches from the centre.\n\nSailors in ancient times understood: if you are lost at sea, on a dark ocean with no land in sight, look for the still star. It points due north. Always. Reliably. Without fail. Ships carrying spices, silk, explorers, and adventurers have all found their way home by that one steady light.\n\nThere is something comforting about a fixed point. The world changes, seasons change, people come and go — but the North Star is there every clear night, waiting, pointing the way.\n\nSome things, it turns out, do last forever.',
    },

    'Cassiopeia': {
      greek: 'Queen Cassiopeia was so vain that she claimed she was more beautiful than the sea-nymphs. Poseidon was furious and sent a sea monster to destroy her kingdom. As punishment, she was placed in the sky in her chair — but it spins around the pole, so she spends half her time hanging upside down.',
      indian: 'In Vedic tradition, these stars are associated with Sharmishtha — a queen from the Puranas. The W-shape is also seen as a hand with the fingers spread wide, pointing toward the pole star. Indian navigators used Cassiopeia alongside Polaris for orientation.',
      egyptian: 'The ancient Egyptians associated this group with a leg or throne, often connecting it to the goddess Hathor. The circumpolar nature of Cassiopeia meant it was seen as eternal and was included in star charts decorating tomb ceilings.',
      filipino: 'Filipino sky-watchers saw the W as a fishing net spread across the sky, or as the outline of a large canoe. The constellation\'s position near the North Star made it useful for fishermen going out at night.',
      science: 'Brightest star: Gamma Cassiopeiae (variable, around mag 2.4, about 550 light-years away). In 1572, a new star appeared in Cassiopeia so bright it was visible in daylight — a supernova observed by Tycho Brahe that changed astronomy forever.',
      story: 'She sits on her throne made of starlight, and she has sat there since the beginning of memory.\n\nQueen Cassiopeia was the most beautiful woman in the world — and she knew it. She told everyone who would listen. She told the fishermen, the merchants, the gods. She climbed the palace walls and shouted it at the sea.\n\nThe sea nymphs heard her. So did Poseidon.\n\nFor that pride, she was taken from her palace and placed among the stars — but not in a dignified way. Her throne spins around the North Star, which means half the night she is seated like a queen, and half the night she is dangling upside-down, her crown nearly falling off, her royal robes flapping in the stellar wind.\n\nSome say this was a mercy. At least she is still in the sky, still recognisable, still the subject of stories.\n\nFind her W-shape tonight. She is either sitting upright, admiring the view, or hanging by her throne trying to look unbothered.\n\nEven upside-down, she is unforgettable.',
    },

    'Scorpius': {
      greek: 'The scorpion was sent by the goddess Gaia (or by Apollo) to kill Orion the Hunter. It succeeded — stinging Orion in the heel. Zeus placed the scorpion in the sky as a reward for its deed. But out of fairness, he placed Orion on the opposite side of the sky so they can never meet again.',
      indian: 'This constellation spans the nakshatras (lunar mansions) of Anuradha, Jyeshtha, and Mula. The heart of the scorpion, marked by Antares, is called Jyeshtha — "the eldest" — and is one of the most important stars in Vedic astrology. It marks a critical point in the zodiac.',
      egyptian: 'The Egyptians associated this region with the goddess Selket, the scorpion goddess who protected the dead on their journey to the afterlife. She was also a healer — keeper of the antidote to scorpion venom. Priests wore her symbol.',
      filipino: 'The Visayan people of the Philippines saw this group of stars as a giant fishhook — "Lawin" or the hawk. The bright star Antares marked the bend of the hook. Fishermen used the rising of this constellation to predict fish migration seasons.',
      science: 'Brightest star: Antares (magnitude 1.0, about 550 light-years away). Antares is a red supergiant so enormous its diameter would stretch from our Sun past the orbit of Mars. The centre of our Milky Way galaxy lies in the direction of Sagittarius, just next door.',
      story: 'Deep in the southern sky, something waits.\n\nIt has been waiting since before the pyramids were built, before the first boats crossed the sea. Its red heart burns with a light so fierce that ancient astronomers named it Antares — "rival of Mars" — because on some nights, the two red lights look like eyes blinking at each other across the sky.\n\nThe scorpion and Orion have a deal, struck long ago by the gods: they will never share the sky at the same time. In winter, Orion rules the heavens. In summer, when Orion has set and the nights grow hot, the Scorpion rises — curling its bright tail above the southern horizon like a question that has never been answered.\n\nWatch the tail. Follow the curve of stars from Antares downward, through the bright hook of Lambda, all the way to the stinger — two tight stars at the very tip, Kappa and Upsilon, barely a finger\'s width apart in the sky.\n\nSomewhere in that direction, hidden behind curtains of dust and starlight, is the centre of our own galaxy.',
    },

    'Leo': {
      greek: 'Leo represents the Nemean Lion, the first of Hercules\' twelve labours. This lion had a hide so tough that no weapon could pierce it. Hercules strangled it with his bare hands and wore its skin as armour. Zeus immortalised the beast in the sky as a tribute to the great battle.',
      indian: 'Leo corresponds to the nakshatra Magha, which means "the great one." In Vedic astrology, the star Regulus (Magha) is the heart of the king of stars — a star of royalty, power, and authority. Ancient Indian kings held coronations when the Moon was near Magha.',
      egyptian: 'The Egyptians called this the Great Lion, and it held deep significance: when the Sun entered Leo during the summer solstice around 3000 BCE, the annual Nile flood began. Many Egyptian temples, including the Sphinx, are thought to face the rising Sun near the Leo-era solstice point.',
      filipino: 'Filipino farmers associated Leo with the dry season — when this constellation was high in the evening sky, it was time to harvest. The Sickle of Leo resembles a curved blade, making it a natural harvest symbol in agricultural communities.',
      science: 'Brightest star: Regulus (magnitude 1.4, about 79 light-years away). Regulus rotates so fast it is noticeably flattened — its equatorial diameter is 32% larger than its polar diameter. The Leo Triplet — three galaxies visible through small telescopes — lies near Denebola.',
      story: 'The lion appears in the west just after sunset, crouching low, his mane blazing with the first stars of the evening sky.\n\nThey say he was the most fearsome creature who ever walked the Earth. His golden fur turned away swords and spears as if they were straw. He roamed his valley like a king, and all the farmers and shepherds lived in fear of him.\n\nThen Hercules came.\n\nNo weapons. No armour. Just the strongest man alive, walking calmly into the darkness of the lion\'s cave.\n\nThey fought through the night. At dawn, silence.\n\nHercules walked out wearing the lion\'s golden skin over his shoulders, carrying the paw like a badge of honour. The lion — so magnificent that even gods had to acknowledge it — was lifted into the sky.\n\nFind the Sickle first: that backwards question mark of stars is his great mane. Regulus burns at the bottom — his heart. A blue-white point of light, turning so fast its own gravity squashes it slightly flat at the poles.\n\nHe has been crouching there since Hercules walked into that cave and changed both their stories forever.',
    },

    'Gemini': {
      greek: 'Castor and Pollux were twin brothers, but with different fathers — Castor was mortal, Pollux immortal. When Castor was killed in a fight, Pollux was so heartbroken he begged Zeus to let him share his immortality. Zeus agreed, placing them together in the sky where they would never be separated.',
      indian: 'In Indian astronomy, these stars correspond to the nakshatra Punarvasu ("the good again" or "return of the good"). The twin stars are associated with Aditi, mother of the gods — symbolising renewal, return, and the comfort of coming home after a long journey.',
      egyptian: 'Egyptian astronomers called this pair "the Two Stars" and associated them with the dual nature of existence — night and day, life and death, the earthly and the divine. They are depicted in some star maps as two figures standing back to back.',
      filipino: 'In some Filipino traditions, the twin stars of Gemini were seen as two brothers who went on a great voyage and were transformed into stars so they could always watch over sailors from above. The constellation rises in the direction fishermen sail toward northern fishing grounds.',
      science: 'Brightest star: Pollux (magnitude 1.1, about 34 light-years away). Pollux has a confirmed exoplanet — Pollux b — a world 2.3 times the mass of Jupiter. Castor, though it looks like one star, is actually six stars in three orbiting pairs — a gravitational family of six suns.',
      story: 'They were born together and they will never be apart.\n\nCastor could tame any horse. Pollux could defeat any man in a fight. Together, they sailed on the great ship Argo, wrestled monsters, found golden fleeces, and came home laughing every time.\n\nThen one day, Castor did not come home.\n\nPollux sat alone in the palace and looked at his hands — hands that could bend iron, hands that had never failed him — and felt completely powerless. He went to Zeus.\n\n"Take my immortality," he said. "Give it to my brother. Or let me go where he has gone."\n\nZeus looked at this hero, this demigod, this son, asking to give up everything — and for once, the king of the gods was moved. He placed them both in the sky. Together. Always within reach of each other, rising and setting as a pair, circling the sky as they had once sailed the sea.\n\nFind them on a winter night — two bright stars, side by side, closer than any other first-magnitude pair in the sky. That is a choice. That is what love looks like from 34 light-years away.',
    },

    'Taurus': {
      greek: 'Zeus disguised himself as a beautiful white bull to win the attention of the princess Europa. She was enchanted and climbed on his back — and he carried her across the sea to the island of Crete, where he revealed himself. The constellation shows only the front half of the bull, as if he is charging through the sky.',
      indian: 'Taurus is home to the Pleiades star cluster, called Krittika in Vedic tradition — the six mothers who nursed the war-god Kartikeya. This was actually the first nakshatra in the ancient system, making Taurus the starting point of the entire Indian star calendar.',
      egyptian: 'The bull was one of Egypt\'s most sacred animals, representing fertility and the power of creation. The star we call Aldebaran was called "the Eye" in some Egyptian texts and was used to mark the vernal equinox around 3000 BCE. Bull sacrifice was central to many religious ceremonies.',
      filipino: 'The Pleiades cluster in Taurus was called "Moroporo" or "Mapulon" by various Filipino groups, and its rising at sunset signalled the start of the planting season. Farmers watched for the Pleiades the way modern people watch a weather forecast.',
      science: 'Brightest star: Aldebaran (magnitude 0.9, about 65 light-years away). The Hyades star cluster (the V-shaped face) is the nearest open cluster to Earth, just 153 light-years away. The Crab Nebula — the remains of a supernova seen by Chinese astronomers in 1054 CE — is in Taurus.',
      story: 'The bull stands just beyond the horizon, and you can feel the ground trembling before you even see him.\n\nHe is enormous — his shoulders brushing the edges of the sky, his one orange eye burning like a coal. That is Aldebaran. It is not actually orange — it is orange-red, a giant star in the last stage of its life, bloated and smoldering. Sixty-five years ago, the light you are seeing right now left that star. Your great-grandparents were children when this particular beam of light began its journey to your eyes.\n\nThe V-shape of stars below Aldebaran is the Hyades cluster — the bull\'s face. These stars are genuinely related, moving together through space like a slow migration. Behind them, far in the background, the Pleiades cluster sparkles. Seven sisters, the Greeks called them. Farmers across Asia knew that when the Pleiades rose just before sunrise, the planting season had begun.\n\nTaurus is a calendar written in stars. People have been reading it for ten thousand years.',
    },

    'Lyra': {
      greek: 'The lyre belonged to Orpheus, the greatest musician who ever lived. His music could tame wild animals, stop rivers, and move stones. When his beloved Eurydice died, he played his way into the underworld and his music made even Hades weep. He nearly brought her back — but looked back too soon.',
      indian: 'The bright star Vega — called Abhijit in Sanskrit — was once the pole star around 12,000 BCE and will be again around the year 14,000. In the Mahabharata, Abhijit is listed as a sacred star. The word "Abhijit" means "the victorious one" — an auspicious star for beginnings.',
      egyptian: 'The Egyptians placed Vega\'s location in their sky charts as part of the northern circumpolar region. The star was associated with the goddess Maat — personification of truth, justice, and cosmic order. Its steadiness in the north made it a symbol of reliability.',
      filipino: 'Vega\'s brightness meant Filipino navigators used it when it was near the zenith to orient themselves at sea. The harp shape reminded some groups of a traditional instrument — a likha or kudyapi — whose strings also made stories come alive.',
      science: 'Brightest star: Vega (magnitude 0.0, about 25 light-years away). Vega was the first star ever photographed (1850) and the first to have its spectrum recorded. It will become our North Star in about 12,000 years as Earth\'s axis completes its slow wobble.',
      story: 'Somewhere in the underworld, music was playing.\n\nThe guards had never heard anything like it. They stopped. The three-headed dog sat down and forgot to growl. Souls who had been wandering for centuries stopped and listened. Even the river Styx slowed.\n\nOrpheus walked through it all playing his lyre, following his wife\'s voice into the dark.\n\nHades himself — god of death, unmoved by prayer, unswayed by tears — pressed his hands together and listened. When the song ended, the cavern was completely silent.\n\n"Take her," said the god of death. "But do not look back until you reach the light."\n\nOrpheus walked. He could hear her footsteps behind him. He could feel the warmth of living air ahead. He climbed toward the light, and the light grew stronger, and just as he stepped into the world —\n\nHe looked back.\n\nVega burns in the summer sky, small and perfect and white, the star of the lyre that moved a god to mercy. It is 25 light-years away. The light reaching your eyes right now left the star when you were much younger. It has been travelling ever since, with its whole story inside it.',
    },

    'Cygnus': {
      greek: 'The swan is thought to be Zeus in disguise, or alternatively Orpheus transformed after his death. Some say it is Cygnus, a friend of Phaethon who plunged into the river Eridanus after the chariot disaster, and was turned into a swan while mourning at the river\'s edge. Zeus placed him in the sky with his friend\'s memory.',
      indian: 'The bright star Deneb, at the swan\'s tail, lies near the point in the sky called the "galactic centre direction" in ancient Indian texts. The Milky Way runs visibly through Cygnus, and Vedic astronomy described this region as the celestial river (Akash Ganga). Deneb is also associated with the nakshatra system as a marker of deep space.',
      egyptian: 'The Egyptian sky region containing Cygnus was associated with Thoth, the ibis-headed god of wisdom and the night sky. The long-necked silhouette of the swan resembled the ibis, and the Milky Way running through it was seen as the celestial counterpart of the Nile.',
      filipino: 'Filipino farmers called the Northern Cross the "bagsak na bituin" or falling star formation — not because it was falling, but because its shape reminded them of a digging stick planting downward into soil. Its rising in the east during harvest season made it a farming calendar marker.',
      science: 'Brightest star: Deneb (magnitude 1.3, distance uncertain — possibly 2,600 light-years). Deneb is one of the most luminous stars known, perhaps 200,000 times brighter than our Sun. Cygnus X-1, within this constellation, was the first strong candidate for a black hole ever identified.',
      story: 'Somewhere in the Milky Way, a swan flies.\n\nThat river of faint light crossing the summer sky — the Milky Way — runs directly through Cygnus, and the swan flies along it, wings spread, neck stretched forward, as if it has been flying that path since before the stars had names.\n\nDeneb burns at the tail — one of the most powerful stars in the entire galaxy. It is so far away that astronomers still argue about the exact distance: somewhere between 1,400 and 2,600 light-years. That uncertainty itself is extraordinary. We know the distance to the Moon within metres. We know the distance to some stars within a few light-years. But Deneb is so luminous, so far, that pinning it down exactly is still an open problem.\n\nIf it were as close to us as Vega, it would cast shadows at night.\n\nAnd deep inside this constellation, hidden in X-ray light that human eyes cannot see, there is a black hole called Cygnus X-1. Matter falls into it in a spiral, screaming in X-rays. The swan flies over it, completely unbothered.\n\nLook for the Northern Cross on a summer night. That is a bird with secrets.',
    },

    'Aquila': {
      greek: 'Aquila was the eagle of Zeus who carried his thunderbolts across the sky. The eagle also carried the beautiful youth Ganymede to Mount Olympus to serve as cupbearer to the gods. Altair, the eagle\'s eye, is one of the three stars of the Summer Triangle.',
      indian: 'The bright star Altair is called Shravana in Sanskrit — "the hearing one" or "the listener." It marks one of the most auspicious nakshatras in Vedic astrology, associated with learning, worship, and the god Vishnu. Ancient Indian astronomers noted Altair\'s rapid rotation based on its intense brightness.',
      egyptian: 'The eagle-like stars in this region were associated with Horus, the falcon-headed god of the sky. The sharpness and brightness of Altair suggested the keen eye of a hawk or eagle hunting from above — a powerful symbol of divine rulership and vision.',
      filipino: 'The bright star Altair, flanked by Gamma and Beta Aquilae, was called "tatlong bituin" — the three stars — by Filipino navigators. The slightly off-centre alignment of the three (Altair is brighter and between the other two) made it easy to identify and useful for east-west orientation at sea.',
      science: 'Brightest star: Altair (magnitude 0.8, about 16.7 light-years away). Altair is one of the fastest-rotating stars known — it completes a full rotation in about 9 hours (compared to the Sun\'s 25 days). This spin is so fast it makes the star visibly flattened at the poles.',
      story: 'The eagle came from a height no human eye could follow.\n\nAltair burns at the centre of three nearly-inline stars — a distinctive sign that led sailors from the Philippines to the Persian Gulf to say: that is east, or close to east, and if you keep it ahead of you, you will find land.\n\nThe eagle of Zeus carried thunderbolts across the sky and once carried a young man named Ganymede from a hillside in Troy all the way to Olympus, because the gods had decided he was too beautiful to live only one life. He became the cupbearer of the gods, immortal and serene, pouring drinks for beings who could rearrange constellations for entertainment.\n\nGanymede is now one of the moons of Jupiter — the largest moon in the solar system. You can see it through binoculars on a clear night.\n\nAltair is only 16.7 light-years away. In cosmic terms, it is a neighbour. Yet it spins so fast — completing a full rotation every nine hours — that it bulges at the equator like a spinning top that has been squeezed. Centrifugal force fights gravity at its equator.\n\nClose. Fast. Bright. The eye of the eagle, watching from just down the street.',
    },

    'Sagittarius': {
      greek: 'Sagittarius is often identified as the centaur Chiron — the wisest centaur, teacher of heroes like Achilles and Hercules. He aims his arrow at the heart of Scorpius. Some say this is because the scorpion killed his student Orion, and Chiron stands guard to ensure the scorpion never threatens the sky again.',
      indian: 'Sagittarius spans several important nakshatras including Purva Ashadha and Uttara Ashadha ("the earlier victory" and "the latter victory"). This is considered the most powerful region of the sky in Vedic astrology — close to the galactic centre, dense with stars and cosmic energy.',
      egyptian: 'Ancient Egyptian priests associated this region of the sky with the god Nefertem, a creator deity associated with the sunrise. They knew the winter solstice sun rose near this direction, and this galactic centre region was thought to be the birthplace of stars themselves.',
      filipino: 'Filipino astronomers in the Visayan tradition associated the teapot shape with a food vessel — a large pot or kaldero — overflowing with steam (the Milky Way rising from the spout area). When this shape was upright in the sky, it signalled the season of abundance.',
      science: 'Brightest star: Epsilon Sagittarii / Kaus Australis (magnitude 1.9, about 145 light-years away). The centre of our Milky Way galaxy lies in the direction of Sagittarius, about 26,000 light-years from Earth. Sagittarius A* — the supermassive black hole at the galactic centre — has a mass of 4 million suns.',
      story: 'Point your finger at the steam rising from the teapot.\n\nYou are pointing at the centre of the galaxy.\n\nRight there — between those stars, through the smudge of Milky Way that rises like steam from the Sagittarius teapot on a summer night — is the absolute centre of our home. Everything out there, all 200 billion stars in the Milky Way, orbits a single point in that direction. At that centre, a black hole four million times the mass of our Sun sits in perfect, terrifying stillness.\n\nThe ancient centaur archer never knew this. Chiron drew his bow and aimed at the scorpion, and he has been aiming ever since. But without knowing it, he was also pointing at the most extraordinary object in our neighbourhood — a cosmic drain, an event horizon, a place where space itself folds inward.\n\nThe Milky Way is densest here. On a very dark night, far from city lights, you can see it as a bright cloud. Ancient peoples described it as the river of heaven, the road of souls, the path the dead travel, the backbone of the sky.\n\nThey were not wrong. It is the backbone. And Sagittarius stands at the heart of it.',
    },

    'Canis Major': {
      greek: 'Canis Major is one of Orion\'s two hunting dogs, following him faithfully across the winter sky. The brightest star, Sirius — also called the Dog Star — is so dazzling that the Romans believed it added its heat to the summer sun. The phrase "dog days of summer" comes from this star.',
      indian: 'The star Sirius is called Lubdhaka in Sanskrit — the hunter or the greedy one. Ancient Indian texts describe it as a guard dog of the sky, watching over the celestial deer (Mrigashira in Orion). Its heliacal rising — first appearance before dawn — was used as a calendar marker.',
      egyptian: 'Sirius was the most important star in all of Egyptian astronomy. They called it Sopdet, identified with the goddess Isis. Its first reappearance in the eastern sky before dawn (heliacal rising) perfectly predicted the annual Nile flood. Temples were built with doorways aligned to the rising of Sirius.',
      filipino: 'The extreme brightness of Sirius made it unmistakable to Filipino sailors — they called it "ang pinakamaliwanag na bituin" (the brightest star). It was used to mark the southern direction and served as an anchor point when navigating between islands at night.',
      science: 'Brightest star: Sirius (magnitude -1.46, about 8.6 light-years away). Sirius is the brightest star in the entire night sky. It is a binary system: Sirius A (the bright one) and Sirius B (a white dwarf the size of Earth but the mass of the Sun) orbit each other every 50 years.',
      story: 'There is a star so bright it has been causing trouble for thousands of years.\n\nIn Egypt, priests watched the eastern horizon before every dawn for months, waiting. When Sirius finally reappeared — after 70 days hidden by the Sun — they called it a miracle. They recorded the day. They sent runners to the river. And sure enough, within days, the Nile would begin to rise, flooding the fields, bringing life to the desert.\n\nFor centuries, that single star predicted the difference between famine and plenty.\n\nSirius is 8.6 light-years away — close enough that if something dramatic happened there today, we would know about it in less than nine years. It shines with the light of 25 suns, but it is not alone: circling it is Sirius B, a white dwarf the size of our entire planet but compressed to the mass of a sun. The two dance around each other every 50 years — one brilliant and alive, one small and cooling, the memory of a star that was once even larger.\n\nWhen Orion rises in the east on winter nights, look below and to the left for the brightest thing in the sky that is not a planet.\n\nThat is where Egypt kept its calendar.',
    },

    'Perseus': {
      greek: 'Perseus was sent to kill Medusa — the Gorgon whose gaze turned people to stone. He used a mirror to avoid her eyes, cut off her head, and used it as a weapon against his enemies. On the way home, he saw Andromeda chained to a cliff as a sacrifice to a sea monster. He killed the monster and married her.',
      indian: 'The star Algol (Beta Persei) is particularly noted in Indian astrology as an inauspicious star — its regular dimming every 2.87 days was considered an ominous blinking. The region of Perseus is associated with Kartikeya, the warrior god, in some Vedic interpretations.',
      egyptian: 'Egyptian star lore in this region connected Perseus to the falcon-headed Horus as a warrior hero. The concept of a hero using wits rather than brute force against a monster resonated with Egyptian mythological tradition, and the story was absorbed into various cultural retellings.',
      filipino: 'The hero Perseus resonated in Filipino mythology through locally equivalent tales of champions who use cleverness to defeat terrible beings. Algol\'s variability — its regular dimming — was noticed by careful Filipino sky-watchers, who called it "ang kumikisap na bituin" (the winking star).',
      science: 'Brightest star: Mirfak / Algenib (magnitude 1.8, about 510 light-years away). Algol (Beta Persei) is an eclipsing binary — two stars that orbit each other and regularly block each other\'s light every 2.87 days, causing it to dim visibly. The Perseus molecular cloud in this region is one of the nearest star-forming regions to Earth.',
      story: 'He was given three impossible tasks and an instruction that has saved many lives since:\n\nDo not look directly at the monster.\n\nPerseus carried a mirrored shield and used it to see Medusa\'s reflection — and that small trick, that sidelong glance, was the difference between stone and survival. He cut off her head while looking the other way.\n\nCarrying something terrible in a bag, flying on winged sandals borrowed from the gods, he crossed the sky over Africa and looked down.\n\nA girl chained to a cliff. A sea monster approaching through the water.\n\nPerseus did not consult anyone. He did not weigh the risks. He dove.\n\nThe star Algol marks the severed head of Medusa — and if you watch it carefully over three nights, you will see it dim and brighten in a regular cycle, 2.87 days exactly. For thousands of years, people thought it was an omen. It is actually two stars eclipsing each other as they orbit — an astronomical clock ticking steadily in the winter sky.\n\nSome things that look like magic turn out to be even more interesting than magic.',
    },

    'Bootes': {
      greek: 'Boötes is the Herdsman or Ploughman — some say it is Arcas, son of Callisto, placed near his mother in the sky. Others say it is Icarius, the first man to learn winemaking from Dionysus. He drove his oxen (represented by Ursa Major) across the sky, ploughing the heavens.',
      indian: 'The star Arcturus is called Swati in Vedic astronomy — "the sword" or "the gem." It is considered highly auspicious, associated with independence, entrepreneurship, and crossing boundaries. Swati is one of the 27 nakshatras and is linked to Vayu, the wind god, symbolising movement and freedom.',
      egyptian: 'Arcturus was noted by Egyptian astronomers for its distinctive orange colour and its position in the northern sky. It was associated with fertility and the growing season — its rising before dawn in spring coincided with planting time, making it a practical calendar star.',
      filipino: 'The bright orange Arcturus was known in Filipino seafaring tradition as a beacon star for the time of year when winds were favourable for long ocean voyages. Its distinctive colour made it easy to identify even in partially cloudy skies.',
      science: 'Brightest star: Arcturus (magnitude -0.04, about 37 light-years away). Arcturus is the brightest star in the northern sky. It appears to be a star that originally came from a dwarf galaxy that merged with the Milky Way billions of years ago — it travels on a different orbital path than most nearby stars, suggesting a different origin.',
      story: 'The herdsman walks slowly, pulling his two dogs on invisible leashes, driving his great ox — the Plough — around the North Star.\n\nHe has been walking like this for as long as anyone can imagine. Every night, without stopping, without complaint. The Plough (Ursa Major) turns, and he turns with it. The seasons change, and he changes his position slightly each season. But he never stops moving, and he never looks tired.\n\nHis brightest star, Arcturus, is orange. Not glaringly, not embarrassingly — just warmly, like a lantern seen across a field on a cold evening. At magnitude -0.04, it is the brightest star in the northern hemisphere, outshining everything above the celestial equator except for a handful.\n\nAstronomers discovered something strange about Arcturus: it seems to come from a different direction than our local stars. It travels on a tilted orbit, like a ball rolling across a table at a slight angle to all the other balls. The best explanation is that it originally formed in a smaller galaxy that was slowly eaten by the Milky Way billions of years ago.\n\nArcturus is a survivor. A traveller from another galaxy, now part of ours, burning amber in the northern spring sky.',
    },

    'Virgo': {
      greek: 'Virgo is Demeter, the goddess of the harvest, holding a sheaf of wheat (marked by the bright star Spica). When her daughter Persephone was taken to the underworld, Demeter stopped all things from growing. The world would have died if Zeus had not negotiated for Persephone\'s return — she spends half the year above ground, and the world blooms.',
      indian: 'Virgo spans several nakshatras including Chitra (marked by Spica). Chitra means "the brilliant one" or "the bright jewel." In Vedic tradition, this star is associated with Vishwakarma, the architect of the gods, and symbolises creativity, artistry, and cosmic design.',
      egyptian: 'The Egyptians associated the region of Virgo with the goddess Isis holding the star Spica as a torch or staff. The heliacal rising of Spica was used as one of many seasonal markers. Some temple alignments in Egypt were oriented toward Spica\'s rising.',
      filipino: 'Virgo rising in the evening sky in spring coincided with the beginning of the rice growing season in many Philippine regions. The figure of a woman carrying grain made immediate sense to farming communities. Spica was sometimes called "ang bituin ng ani" — the harvest star.',
      science: 'Brightest star: Spica (magnitude 1.0, about 250 light-years away). Spica is actually two stars orbiting each other every 4 days — so close together that tidal forces distort them into egg shapes. The Virgo Cluster, a vast collection of about 1,300 galaxies, lies in this direction about 50 million light-years away.',
      story: 'Persephone was picking flowers in a meadow when the ground opened.\n\nDemeter searched the entire Earth. She let the crops die. She let the trees wither. She walked through a grey, lifeless world looking for her daughter. Farmers begged the gods for help. Shepherds watched their animals grow thin.\n\nThe gods eventually negotiated a deal — half the year above, half below — and when Persephone returns each spring, Demeter lets the world bloom again. Virgo rises in the evening sky as spring begins. Spica burns blue-white at the base of the wheat sheaf.\n\nSpica is 250 light-years away and is actually two stars — so close together their gravity distorts each other into slightly oval shapes, orbiting in just 4 days. Two stars stretched by their closeness to each other, looking like one point of light from here.\n\nAnd in the direction of Virgo — far, far behind it, a hundred times farther than Spica — lies the Virgo Cluster. Over a thousand galaxies. Each galaxy containing hundreds of billions of stars. All clustered together in space like a vast, slow crowd, each member separated from its neighbours by millions of light-years of dark.\n\nDemeter holds her wheat sheaf and does not appear to notice.',
    },

    'Crux': {
      greek: 'The Southern Cross was known to ancient Greek sailors but slipped below the European horizon as centuries passed and navigation shifted north. By the time of exploration, Europeans rediscovered it with astonishment. It is considered a separate constellation from any classical Greek figure, though some connected it to the tree that became Centaurus.',
      indian: 'Ancient Indian navigators who sailed to Indonesia and the Pacific were familiar with the Southern Cross as a southern guide star. The four stars are sometimes associated with the four directions in Buddhist cosmology, and the region was carefully mapped by Tamil and Malay navigators in the Indian Ocean trade networks.',
      egyptian: 'The Southern Cross was visible from Egypt in ancient times (around 2500 BCE, it rose above the southern horizon). The Egyptians associated it with the southern sky guardians — protective stars that marked the lower boundary of the known heavens.',
      filipino: 'The Southern Cross is called "Krus" in Filipino, and it holds a central place in Austronesian seafaring tradition. Navigators used the two long-bar stars (Acrux and Gamma Crucis) like a compass needle pointing toward the south celestial pole, allowing precise southward navigation across open ocean.',
      science: 'Brightest star: Acrux (magnitude 0.8, about 321 light-years away). Despite being the smallest of the 88 official constellations, Crux contains more bright stars per unit area than any other constellation. It appears on the national flags of Australia, New Zealand, Brazil, Papua New Guinea, and Samoa.',
      story: 'For centuries, anyone north of Cairo could not see it.\n\nThe Southern Cross had slipped below the horizon as the centuries passed and civilisations moved northward. Only sailors who ventured far south, or people who had always lived in the southern hemisphere, kept its knowledge alive.\n\nWhen European explorers rounded the Cape of Good Hope in the 15th century, they saw it rising in the south and wrote home with barely contained excitement. A cross of stars. Perfect, symmetrical, unmistakable.\n\nFor the Polynesian navigators who had been crossing the Pacific for thousands of years, this was not news. The Southern Cross was old knowledge, dependable knowledge. The long bar of the cross — Acrux to Gamma — points toward the south celestial pole. Extend that line by four and a half times its length and you are looking at the southern equivalent of Polaris. No bright star marks that spot, but the Cross shows you where it is.\n\nFive nations put it on their flags. They did not choose it randomly.\n\nIt is the compass rose of the southern sky.',
    },

    'Centaurus': {
      greek: 'Centaurus is usually identified as Chiron — the wisest and most civilised of all centaurs, who tutored Achilles, Jason, and Hercules. Unlike other centaurs who were wild and violent, Chiron was a skilled healer and teacher. When he was accidentally wounded by one of Hercules\' poisoned arrows, he chose to give up his immortality to end his suffering.',
      indian: 'In Indian astronomical tradition, the stars of Centaurus fall in the nakshatra region of Vishakha and Anuradha. The concept of a half-human, half-horse being has parallels in the Kinnara creatures of Hindu mythology — celestial musicians who are also half-human, symbolising the union of the earthly and the divine.',
      egyptian: 'The Egyptians called this region the sky of the south and associated it with the god Khonsu — a moon deity who also had a warrior aspect. The centaur figure resonated with Egyptian depictions of guardian figures with animal bodies and human heads.',
      filipino: 'Centaurus rising in the south was a key navigation constellation for Austronesian voyagers heading toward Australia and the southern Pacific islands. The two bright pointer stars (Alpha and Beta Centauri) were known as "mga gabay sa timog" — the southern guides — pointing toward the Southern Cross.',
      science: 'Brightest star: Alpha Centauri A (magnitude -0.01, 4.37 light-years away). Alpha Centauri is the closest star system to our Sun. It is a triple system: Alpha A, Alpha B (both Sun-like), and Proxima Centauri (a red dwarf, the absolutely closest star at 4.24 light-years). Proxima Centauri has a confirmed potentially-rocky planet in its habitable zone: Proxima b.',
      story: 'The closest star is right here.\n\nThe two bright pointer stars — Alpha and Beta Centauri — are among the brightest in the sky. Alpha Centauri outshines everything in the southern constellation. But what makes it remarkable is not its brightness: it is the distance.\n\n4.37 light-years. In the entire Milky Way — a galaxy 100,000 light-years across — this system is essentially next door. If the Sun were a grapefruit in London, Alpha Centauri would be another grapefruit in Paris.\n\nAnd it is not one star. It is three. Alpha A and B orbit each other every 80 years, close enough to look like one point of light to the naked eye. Far from both, on a 550,000-year orbit, a tiny red dwarf called Proxima circles the system. Proxima is currently slightly closer to us than the other two — making it the single nearest star to our Sun.\n\nProxima has a planet. Rocky, probably. In the habitable zone, probably. Called Proxima b.\n\nWe do not know if anything lives there. We have no way to visit — not for thousands of years with any technology we can imagine.\n\nBut the light from that planet, if we were standing there, would show us a sky with a bright yellow star in it: ours.',
    },

    'Corona Borealis': {
      greek: 'The Northern Crown is the jewelled crown given by Dionysus (or Theseus) to the princess Ariadne, who helped Theseus navigate the Labyrinth by giving him a thread to follow. After helping Theseus, she was abandoned. Dionysus fell in love with her and set her crown among the stars as an eternal tribute.',
      indian: 'The arc of Corona Borealis falls near the nakshatra Anuradha — which means "following Radha" or "the disciple." In Vedic tradition, this small, neat arc of stars is seen as a garland of devotion, and the nakshatra is associated with friendship, loyalty, and the deep bonds that survive hardship.',
      egyptian: 'The small arc of stars in Corona Borealis was associated in some Egyptian texts with the sacred lotus, which opens in a semicircle. The lotus was the symbol of creation and daily rebirth — each morning, the Sun rises like a lotus blooming. This delicate constellation was a heavenly version of that eternal image.',
      filipino: 'Filipino sky-watchers saw the arc of Corona Borealis as a fishing net or a curved bamboo trap — the semicircle matched the shape of traditional fish traps. When the Crown was high in the sky after dark, certain fish were known to run in the rivers, making it a fisherman\'s calendar.',
      science: 'Brightest star: Gemma / Alphecca (magnitude 2.2, about 75 light-years away). Corona Borealis contains a remarkable object called T Coronae Borealis — a recurrent nova that periodically brightens dramatically. It last exploded in 1946 and is predicted to explode again around 2024-2025, potentially becoming visible to the naked eye.',
      story: 'She had done everything right.\n\nAriadne gave Theseus the thread that saved his life. She showed him the way into the Labyrinth, the way out again, the path back to his ship. Without her, Athens would have lost a hero and Theseus would have become part of the darkness under the palace.\n\nHe sailed away without her. The histories are inconsistent about why. Maybe he forgot. Maybe he thought he had to. The stories are never kind to the women who made the heroism possible.\n\nDionysus found her on the island of Naxos. He set her crown among the stars — not as a reminder of what she lost, but as a statement: she was here. She mattered. The labyrinth was navigated because of her.\n\nThe Crown is small. Just a few stars in a neat arc, easy to miss between the bright diagonals of Boötes and Hercules. But it has been there every summer night for longer than anyone can count.\n\nAnd somewhere in that constellation, a variable star called T Coronae Borealis has been building toward an explosion for decades. When it goes — and it will — it will briefly burn as bright as Polaris. A nova flaring from the crown.\n\nAriadne\'s crown, catching fire.',
    },

  };

  // ── Load ─────────────────────────────────────────────────────────────────
  async function load(jsonPath) {
    // If the stars were embedded directly in the HTML page (single-file mode),
    // use that. Otherwise fetch from the given path.
    _stars = (typeof EMBEDDED_STARS !== 'undefined')
      ? EMBEDDED_STARS
      : await (await fetch(jsonPath)).json();

    // Filter to naked-eye range and pre-compute display properties
    _processed = _stars
      .filter(s => s.mag <= 6.8)
      .map((s, idx) => ({
        ...s,
        idx,                                      // position in filtered array
        baseRadius: AstroMath.magToRadius(s.mag), // canvas radius at zoom=1
        baseAlpha:  AstroMath.magToAlpha(s.mag),  // opacity at zoom=1
      }));

    return _processed;
  }

  // ── Constellation lookup ──────────────────────────────────────────────────

  /**
   * getConstellationForStar(filteredIdx)
   * Given the index of a star in the filtered array, return the constellation
   * it belongs to, or null if it is not a member of any defined constellation.
   * This is the core of the new constellation-centric information model.
   */
  function getConstellationForStar(filteredIdx) {
    return _starToConstellation.get(filteredIdx) || null;
  }

  /**
   * getConstellationLore(constellationName)
   * Return the full lore object for a constellation by name.
   */
  function getConstellationLore(name) {
    return CONSTELLATION_LORE[name] || null;
  }

  return {
    load,
    getConstellationForStar,
    getConstellationLore,
    getStars()          { return _processed; },
    getRaw()            { return _stars; },
    getConstellations() { return CONSTELLATIONS; },
  };

})();

  </script>
  <script>
  /**
 * renderer.js — Canvas sky rendering
 *
 * CHANGES FROM PREVIOUS VERSION:
 *   1. Constellation lines are now drawn with two passes:
 *      - All non-selected constellations are drawn dim (dashed, low opacity)
 *      - The selected constellation is drawn bright (solid, higher opacity)
 *        This makes the active constellation visually stand out clearly.
 *   2. AppState now carries `selectedConstellation` (a constellation object)
 *      instead of `selectedStar`. The renderer highlights all lines of that
 *      constellation and all its member stars.
 *   3. Constellation label rendering removed the emoji (per requirements).
 *   4. Member stars of the selected constellation get a subtle highlight ring,
 *      not just the single clicked star.
 */

'use strict';

const Renderer = (() => {
  let canvas, ctx, W, H, cx, cy;

  // Stores last-frame projected star positions for hit-testing by main.js
  const _projected = [];

  // Colour constants — kept as a central palette for easy tweaking
  const C = {
    starCore:          '#ffffff',
    // Normal constellation lines: dashed, semi-transparent
    constLineNormal:   'rgba(90, 160, 230, 0.30)',
    // Selected constellation lines: solid, brighter, clearly visible
    constLineSelected: 'rgba(160, 210, 255, 0.90)',
    // Member star highlight ring colour (selected constellation)
    memberRing:        'rgba(130, 195, 255, 0.70)',
    gridLine:          'rgba(79,195,247,0.12)',
    horizonLine:       'rgba(79,195,247,0.50)',
    gridLabel:         'rgba(79,195,247,0.55)',
    cardinal:          'rgba(79,195,247,0.85)',
    labelText:         'rgba(220,240,255,0.75)',
    // Clicked star: gold ring
    clickedRing:       'rgba(255,215,80,0.9)',
    starGlow:          a => `rgba(200,225,255,${(a*0.3).toFixed(2)})`,
    namedGlow:         a => `rgba(255,220,130,${(a*0.5).toFixed(2)})`,
  };

  function init(canvasEl) {
    canvas = canvasEl;
    ctx = canvas.getContext('2d');
    resize();
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    cx = W / 2;
    cy = H / 2;
  }

  // ── Background ────────────────────────────────────────────────────────────
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0,   '#000509');
    sky.addColorStop(0.7, '#000c1a');
    sky.addColorStop(1,   '#03111f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Atmospheric glow fixed at bottom of screen
    const glow = ctx.createLinearGradient(0, H * 0.78, 0, H);
    glow.addColorStop(0,   'rgba(0,0,0,0)');
    glow.addColorStop(0.5, 'rgba(10,40,80,0.35)');
    glow.addColorStop(1,   'rgba(15,50,100,0.55)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
  }

  // ── Grid ──────────────────────────────────────────────────────────────────
  function drawGrid(state) {
    if (!state.showGrid) return;
    const { viewAlt, viewAz, fovScale } = state;
    ctx.save();

    // Horizon line at alt = 0
    ctx.beginPath();
    ctx.strokeStyle = C.horizonLine;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    let first = true;
    for (let az = 0; az <= 361; az += 2) {
      const p = AstroMath.project(0, az % 360, viewAlt, viewAz, fovScale, cx, cy);
      if (!p.visible) { first = true; continue; }
      first ? (ctx.moveTo(p.x, p.y), first = false) : ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    // Altitude rings at 30° and 60°
    for (const alt of [30, 60]) {
      ctx.beginPath();
      ctx.strokeStyle = C.gridLine;
      ctx.lineWidth = 0.7;
      ctx.setLineDash([4, 7]);
      first = true;
      for (let az = 0; az <= 361; az += 2) {
        const p = AstroMath.project(alt, az % 360, viewAlt, viewAz, fovScale, cx, cy);
        if (!p.visible) { first = true; continue; }
        first ? (ctx.moveTo(p.x, p.y), first = false) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // Azimuth spokes every 30°
    ctx.setLineDash([3, 8]);
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = C.gridLine;
    for (let az = 0; az < 360; az += 30) {
      ctx.beginPath();
      first = true;
      for (let alt = 2; alt <= 88; alt += 4) {
        const p = AstroMath.project(alt, az, viewAlt, viewAz, fovScale, cx, cy);
        if (!p.visible) { first = true; continue; }
        first ? (ctx.moveTo(p.x, p.y), first = false) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // Altitude degree labels
    ctx.setLineDash([]);
    ctx.font = '10px "Space Mono", monospace';
    ctx.fillStyle = C.gridLabel;
    for (const alt of [30, 60]) {
      const p = AstroMath.project(alt, viewAz, viewAlt, viewAz, fovScale, cx, cy);
      if (p.visible) ctx.fillText(`${alt}\u00b0`, p.x + 4, p.y - 4);
    }
    ctx.restore();
  }

  // ── Cardinal direction labels ─────────────────────────────────────────────
  function drawCardinals(state) {
    const { viewAlt, viewAz, fovScale } = state;
    const dirs = [
      {az:0,l:'N'},{az:90,l:'E'},{az:180,l:'S'},{az:270,l:'W'},
      {az:45,l:'NE'},{az:135,l:'SE'},{az:225,l:'SW'},{az:315,l:'NW'},
    ];
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const { az, l } of dirs) {
      const p = AstroMath.project(1, az, viewAlt, viewAz, fovScale, cx, cy);
      if (!p.visible) continue;
      ctx.font = l.length === 1
        ? 'bold 13px "Orbitron", monospace'
        : '10px "Orbitron", monospace';
      ctx.fillStyle = C.cardinal;
      ctx.strokeStyle = 'rgba(79,195,247,0.3)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 10);
      ctx.lineTo(p.x, p.y + 10);
      ctx.stroke();
      ctx.fillText(l, p.x, p.y - 20);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // ── Constellation lines ───────────────────────────────────────────────────
  // Two-pass drawing:
  //   Pass 1: All constellations drawn dim with dashed lines
  //   Pass 2: Selected constellation redrawn bright with solid lines
  // This avoids the selected constellation being buried under dim lines.
  function drawConstellations(state) {
    if (!state.showConstellations) return;
    const { viewAlt, viewAz, fovScale, jd, lat, lon, selectedConstellation } = state;
    const stars = StarData.getStars();

    ctx.save();

    // ── Pass 1: draw all constellations dim ───────────────────────────────
    ctx.lineWidth = 0.9;
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = C.constLineNormal;

    for (const con of StarData.getConstellations()) {
      // Skip the selected one — we draw it separately in pass 2
      if (selectedConstellation && con.name === selectedConstellation.name) continue;

      for (const [i1, i2] of con.lines) {
        const s1 = stars[i1], s2 = stars[i2];
        if (!s1 || !s2) continue;
        const h1 = AstroMath.equatorialToHorizontal(s1.ra, s1.dec, lat, jd, lon);
        const h2 = AstroMath.equatorialToHorizontal(s2.ra, s2.dec, lat, jd, lon);
        if (h1.alt < -8 || h2.alt < -8) continue;
        const p1 = AstroMath.project(h1.alt, h1.az, viewAlt, viewAz, fovScale, cx, cy);
        const p2 = AstroMath.project(h2.alt, h2.az, viewAlt, viewAz, fovScale, cx, cy);
        if (!p1.visible || !p2.visible) continue;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }

    // ── Pass 2: draw selected constellation bright and solid ──────────────
    if (selectedConstellation) {
      ctx.lineWidth = 1.8;
      ctx.setLineDash([]);                       // solid, not dashed
      ctx.strokeStyle = C.constLineSelected;

      for (const [i1, i2] of selectedConstellation.lines) {
        const s1 = stars[i1], s2 = stars[i2];
        if (!s1 || !s2) continue;
        const h1 = AstroMath.equatorialToHorizontal(s1.ra, s1.dec, lat, jd, lon);
        const h2 = AstroMath.equatorialToHorizontal(s2.ra, s2.dec, lat, jd, lon);
        if (h1.alt < -8 || h2.alt < -8) continue;
        const p1 = AstroMath.project(h1.alt, h1.az, viewAlt, viewAz, fovScale, cx, cy);
        const p2 = AstroMath.project(h2.alt, h2.az, viewAlt, viewAz, fovScale, cx, cy);
        if (!p1.visible || !p2.visible) continue;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }

    ctx.setLineDash([]);

    // ── Constellation name labels ─────────────────────────────────────────
    // Computed as centroid of visible member stars.
    // Selected constellation label is drawn brighter.
    ctx.font = '10px "Orbitron", monospace';
    ctx.textAlign = 'center';

    for (const con of StarData.getConstellations()) {
      const isSelected = selectedConstellation && con.name === selectedConstellation.name;
      ctx.fillStyle = isSelected
        ? 'rgba(160,210,255,0.90)'   // bright for selected
        : 'rgba(100,165,230,0.45)';  // dim for others

      const allIdx = [...new Set(con.lines.flat())];
      let sx = 0, sy = 0, n = 0;
      for (const idx of allIdx) {
        const s = stars[idx];
        if (!s) continue;
        const h = AstroMath.equatorialToHorizontal(s.ra, s.dec, lat, jd, lon);
        if (h.alt < 5) continue;
        const p = AstroMath.project(h.alt, h.az, viewAlt, viewAz, fovScale, cx, cy);
        if (!p.visible) continue;
        sx += p.x; sy += p.y; n++;
      }
      if (n > 1) ctx.fillText(con.name, sx / n, sy / n - 14);
    }

    ctx.textAlign = 'left';
    ctx.restore();
  }

  // ── Stars ─────────────────────────────────────────────────────────────────
  function drawStars(state) {
    const {
      viewAlt, viewAz, fovScale, jd, lat, lon,
      showLabels, selectedConstellation, clickedStar,
    } = state;
    const stars = StarData.getStars();
    _projected.length = 0;

    // Build a Set of member-star indices for the selected constellation,
    // used to decide whether to draw a member highlight ring.
    const memberSet = new Set();
    if (selectedConstellation) {
      for (const idx of selectedConstellation.stars) memberSet.add(idx);
    }

    for (const star of stars) {
      const h = AstroMath.equatorialToHorizontal(star.ra, star.dec, lat, jd, lon);
      if (h.alt < -2) continue;

      const p = AstroMath.project(h.alt, h.az, viewAlt, viewAz, fovScale, cx, cy);
      if (!p.visible) continue;
      if (p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) continue;

      const r     = star.baseRadius;
      const alpha = star.baseAlpha;
      const named = star.name && star.name.trim().length > 0;

      // Glow halo
      const gr = r * 4;
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
      gg.addColorStop(0, named ? C.namedGlow(alpha) : C.starGlow(alpha));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, gr, 0, Math.PI * 2);
      ctx.fill();

      // Star core
      ctx.globalAlpha = alpha;
      ctx.fillStyle = C.starCore;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.6, r), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Diffraction spikes for very bright stars (mag < 1.5)
      if (star.mag < 1.5) {
        ctx.save();
        ctx.globalAlpha = alpha * 0.28;
        ctx.strokeStyle = '#c8e6ff';
        ctx.lineWidth = 0.8;
        for (let a = 0; a < 360; a += 45) {
          const rad = a * AstroMath.D2R;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(rad) * r,       p.y + Math.sin(rad) * r);
          ctx.lineTo(p.x + Math.cos(rad) * r * 14,  p.y + Math.sin(rad) * r * 14);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Member star ring: subtle blue ring on all stars in selected constellation
      if (memberSet.has(star.idx)) {
        ctx.save();
        ctx.strokeStyle = C.memberRing;
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 2.5 + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Clicked star ring: gold, on top of the member ring if applicable
      if (clickedStar && clickedStar === star) {
        ctx.save();
        ctx.strokeStyle = C.clickedRing;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 3 + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 4 + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Star name labels for bright named stars
      if (showLabels && named && star.mag < 3.5) {
        ctx.save();
        ctx.font = '10px "Space Mono", monospace';
        ctx.fillStyle = C.labelText;
        ctx.fillText(cleanLabel(star.name), p.x + r + 4, p.y - r);
        ctx.restore();
      }

      _projected.push({ star, x: p.x, y: p.y, r: Math.max(r, 5), alt: h.alt, az: h.az });
    }
  }

  // ── Utility: clean up catalog name for display ────────────────────────────
  function cleanLabel(name) {
    if (!name) return '';
    const bayer = {
      Alp:'α', Bet:'β', Gam:'γ', Del:'δ', Eps:'ε', Zet:'ζ', Eta:'η',
      The:'θ', Iot:'ι', Kap:'κ', Lam:'λ', 'Mu ':'μ', 'Pi ':'π',
      Sig:'σ', Tau:'τ',
    };
    let n = name.replace(/^\d+/, '').trim();
    for (const [k, v] of Object.entries(bayer)) {
      if (n.startsWith(k)) { n = v + ' ' + n.slice(k.length).trim(); break; }
    }
    return n.length > 14 ? n.slice(0, 14) : n;
  }

  // ── Hit-test: find nearest projected star within radius ───────────────────
  function hitTest(px, py, radius) {
    let best = null, bestDist = Infinity;
    for (const proj of _projected) {
      const dx = proj.x - px, dy = proj.y - py;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < radius && dist < bestDist) {
        bestDist = dist;
        best = proj;
      }
    }
    return best;   // { star, x, y, r, alt, az } or null
  }

  // ── Main draw entry point ─────────────────────────────────────────────────
  function draw(state) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGrid(state);
    drawCardinals(state);
    drawConstellations(state);
    drawStars(state);
  }

  return { init, resize, draw, hitTest };

})();

  </script>
  <script>
  /**
 * input.js — User input handling
 *
 * PAN DIRECTION FIX:
 *   Dragging RIGHT → sky moves RIGHT (az increases)
 *     dx positive → az += dx*sens  (positive delta)
 *   Dragging DOWN → sky moves DOWN (alt decreases, we look lower)
 *     dy positive (canvas down) → alt -= dy*sens
 *
 *   In other words: the sky follows your finger/mouse, like dragging a map.
 */
'use strict';

const Input = (() => {
  let state, onClickStar, onToggle;
  let isDragging = false, lastX = 0, lastY = 0, dragDistance = 0;
  let touchStartX = 0, touchStartY = 0, touchDragDist = 0;

  const CLICK_THRESHOLD = 8;
  const ZOOM_FACTOR = 1.12;
  const KEY_STEP_AZ = 3, KEY_STEP_ALT = 2;

  function init(appState, clickCb, toggleCb) {
    state = appState; onClickStar = clickCb; onToggle = toggleCb;
    const canvas = document.getElementById('skyCanvas');
    canvas.addEventListener('mousedown',  onMouseDown,  { passive: false });
    canvas.addEventListener('mousemove',  onMouseMove,  { passive: false });
    canvas.addEventListener('mouseup',    () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    canvas.addEventListener('wheel',      onWheel,      { passive: false });
    canvas.addEventListener('click',      onClick);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
    window.addEventListener('keydown', onKeyDown);
  }

  function onMouseDown(e) {
    e.preventDefault(); isDragging = true; dragDistance = 0;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onMouseMove(e) {
    if (!isDragging) return; e.preventDefault();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    dragDistance += Math.abs(dx) + Math.abs(dy);
    pan(dx, dy); lastX = e.clientX; lastY = e.clientY;
  }
  function onClick(e) { if (dragDistance <= CLICK_THRESHOLD) onClickStar(e.clientX, e.clientY); }
  function onWheel(e) { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }

  function onTouchStart(e) {
    e.preventDefault();
    if (e.touches.length !== 1) return;
    isDragging = true; touchDragDist = 0; dragDistance = 0;
    lastX = touchStartX = e.touches[0].clientX;
    lastY = touchStartY = e.touches[0].clientY;
  }
  function onTouchMove(e) {
    e.preventDefault(); if (!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    touchDragDist += Math.abs(dx) + Math.abs(dy); dragDistance = touchDragDist;
    pan(dx, dy); lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
  function onTouchEnd(e) {
    e.preventDefault(); isDragging = false;
    if (touchDragDist <= CLICK_THRESHOLD) onClickStar(touchStartX, touchStartY);
  }

  function onKeyDown(e) {
    if (e.target.tagName === 'INPUT') return;
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); state.viewAz = AstroMath.wrap360(state.viewAz - KEY_STEP_AZ);  break;
      case 'ArrowRight': e.preventDefault(); state.viewAz = AstroMath.wrap360(state.viewAz + KEY_STEP_AZ);  break;
      case 'ArrowUp':    e.preventDefault(); state.viewAlt = clampAlt(state.viewAlt + KEY_STEP_ALT);        break;
      case 'ArrowDown':  e.preventDefault(); state.viewAlt = clampAlt(state.viewAlt - KEY_STEP_ALT);        break;
      case '+': case '=': zoom(+1); break;
      case '-': case '_': zoom(-1); break;
      case 'c': case 'C': onToggle('constellations'); break;
      case 'l': case 'L': onToggle('labels');         break;
      case 'g': case 'G': onToggle('grid');            break;
      case 'Escape':       onToggle('closePanel');      break;
    }
  }

  /**
   * pan(dx, dy) — sky follows the pointer (like dragging a map)
   *
   * Key insight: fovScale is pixels-per-radian at the centre.
   * So 1 pixel of drag = 1/fovScale radians of sky movement.
   * We want the sky to move WITH the drag, so:
   *   az  += dx * (R2D / fovScale)  → dragging right increases azimuth
   *   alt -= dy * (R2D / fovScale)  → dragging down decreases altitude (canvas y grows down)
   */
  function pan(dx, dy) {
    const sens = AstroMath.R2D / state.fovScale;
    state.viewAz  = AstroMath.wrap360(state.viewAz  + dx * sens);
    state.viewAlt = clampAlt(state.viewAlt - dy * sens);
  }

  function clampAlt(a) { return Math.max(-15, Math.min(90, a)); }

  function zoom(dir) {
    const MIN = 60, MAX = 2400;
    state.fovScale = dir > 0
      ? Math.min(MAX, state.fovScale * ZOOM_FACTOR)
      : Math.max(MIN, state.fovScale / ZOOM_FACTOR);
    state.zoom = state.fovScale / 400;
  }

  return { init };
})();

  </script>
  <script>
  /**
 * main.js — Application entry point and orchestration
 *
 * CHANGES FROM PREVIOUS VERSION:
 *
 *   1. INFORMATION MODEL SHIFT (star -> constellation):
 *      Previously: handleStarClick() looked up lore for the star itself.
 *      Now:        handleStarClick() uses StarData.getConstellationForStar()
 *                  to find which constellation the clicked star belongs to,
 *                  then displays that constellation's full lore.
 *
 *   2. AppState now carries:
 *        selectedConstellation  — the full constellation object (for renderer)
 *        clickedStar            — the specific star clicked (for gold ring)
 *      The renderer uses selectedConstellation to highlight all member stars
 *      and draw the constellation's lines brighter.
 *
 *   3. Panel is now tabbed (Myths | Science | Story).
 *      Tab switching is handled by switchTab() — it toggles the "active"
 *      class on both the tab button and the corresponding tab pane.
 *
 *   4. showConstellationPanel() populates all tab content at once
 *      (all text is injected into the DOM when a star is clicked),
 *      so switching tabs is instant with no re-computation.
 *
 *   5. If a star is not part of any constellation, we show a minimal
 *      "not in a constellation" message rather than empty panels.
 *
 *   6. All emoji removed from UI strings per requirements.
 */

'use strict';

// ── Application State ─────────────────────────────────────────────────────────
const AppState = {
  // Observer location (degrees)
  lat: 9.96,
  lon: 76.24,

  // Camera direction
  viewAz:  180,
  viewAlt: 40,

  // Projection scale (pixels per radian) and derived star size factor
  fovScale: 400,
  zoom:     1.0,

  // UI toggles
  showConstellations: true,
  showLabels:         true,
  showGrid:           true,

  // Updated every frame
  jd: 0,

  // NEW: selected constellation object (for renderer highlighting)
  // This is the full constellation entry from CONSTELLATIONS array.
  selectedConstellation: null,

  // NEW: the specific star that was clicked (for gold ring only)
  clickedStar: null,
};

// ── DOM references ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const el = {
  canvas:       $('skyCanvas'),
  hudTime:      $('hud-time'),
  hudLoc:       $('hud-location'),
  hudView:      $('hud-view'),
  loading:      $('loading-screen'),
  locModal:     $('location-modal'),
  inpLat:       $('inp-lat'),
  inpLon:       $('inp-lon'),
  btnGPS:       $('btn-use-gps'),
  btnStart:     $('btn-start'),
  // Info panel (new structure)
  panel:        $('info-panel'),
  panelClose:   $('panel-close'),
  panelName:    $('panel-con-name'),
  panelSub:     $('panel-con-subtitle'),
  mythGreek:    $('myth-greek'),
  mythIndian:   $('myth-indian'),
  mythEgyptian: $('myth-egyptian'),
  mythFilipino: $('myth-filipino'),
  scienceText:  $('science-text'),
  storyText:    $('story-text'),
};

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function bootstrap() {
  el.loading.classList.add('hidden');
  el.locModal.classList.remove('hidden');

  el.btnGPS.addEventListener('click', () => {
    if (!navigator.geolocation) return alert('Geolocation not available.');
    el.btnGPS.textContent = 'Finding location...';
    navigator.geolocation.getCurrentPosition(
      pos => {
        el.inpLat.value = pos.coords.latitude.toFixed(4);
        el.inpLon.value = pos.coords.longitude.toFixed(4);
        el.btnGPS.textContent = 'Location found';
      },
      () => {
        el.btnGPS.textContent = 'Find My Location Automatically';
        alert('Could not get location. Please enter manually.');
      }
    );
  });

  el.btnStart.addEventListener('click', async () => {
    const lat = parseFloat(el.inpLat.value);
    const lon = parseFloat(el.inpLon.value);
    if (isNaN(lat) || lat < -90 || lat > 90) {
      return alert('Please enter a valid latitude (-90 to 90).');
    }
    AppState.lat = lat;
    AppState.lon = lon;
    // Southern hemisphere: default look direction toward equator (north)
    if (lat < 0) AppState.viewAz = 0;

    el.locModal.classList.add('hidden');
    el.loading.classList.remove('hidden');
    try {
      await StarData.load('stars.json');
    } catch (e) {
      return alert('Failed to load stars: ' + e.message);
    }
    el.loading.classList.add('hidden');

    Renderer.init(el.canvas);
    window.addEventListener('resize', () => Renderer.resize());
    Input.init(AppState, handleStarClick, handleToggle);

    el.panelClose.addEventListener('click', closePanel);

    // Wire up tab buttons: clicking a tab switches the visible pane
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    requestAnimationFrame(renderLoop);
  });
}

// ── Render Loop ────────────────────────────────────────────────────────────────
let _lastHudUpdate = 0;

function renderLoop(timestamp) {
  // Update Julian Date live (real-time sky)
  AppState.jd = AstroMath.julianDate(new Date());
  Renderer.draw(AppState);

  // Update HUD readout at 2 Hz (no need every frame)
  if (timestamp - _lastHudUpdate > 500) {
    updateHUD();
    _lastHudUpdate = timestamp;
  }
  requestAnimationFrame(renderLoop);
}

// ── HUD update ────────────────────────────────────────────────────────────────
function updateHUD() {
  const now = new Date();
  const lst = AstroMath.lstDeg(AppState.jd, AppState.lon);
  const lh  = lst / 15;
  const lhh = Math.floor(lh);
  const lmm = Math.floor((lh - lhh) * 60);
  const lss = Math.floor(((lh - lhh) * 60 - lmm) * 60);

  el.hudTime.textContent =
    `UTC ${now.toISOString().slice(11,19)}  LST ${p2(lhh)}h${p2(lmm)}m${p2(lss)}s`;
  el.hudLoc.textContent =
    `lat ${AppState.lat >= 0 ? '+' : ''}${AppState.lat.toFixed(2)}  ` +
    `lon ${AppState.lon >= 0 ? '+' : ''}${AppState.lon.toFixed(2)}`;
  el.hudView.textContent =
    `Az ${AppState.viewAz.toFixed(1)}  Alt ${AppState.viewAlt.toFixed(1)}  ` +
    `Zoom x${(AppState.fovScale / 400).toFixed(1)}`;
}

function p2(n) { return String(n).padStart(2, '0'); }

// ── Star click handler ─────────────────────────────────────────────────────────
// This is the entry point of the constellation-centric model.
function handleStarClick(px, py) {
  const hit = Renderer.hitTest(px, py, 24);
  if (!hit) {
    // Click on empty sky: deselect everything
    AppState.selectedConstellation = null;
    AppState.clickedStar = null;
    closePanel();
    return;
  }

  // Record the clicked star for the gold ring in the renderer
  AppState.clickedStar = hit.star;

  // NEW: reverse-lookup which constellation this star belongs to
  const constellation = StarData.getConstellationForStar(hit.star.idx);

  if (!constellation) {
    // Star exists but is not part of any defined constellation
    AppState.selectedConstellation = null;
    showUnknownStar(hit.star, hit.alt, hit.az);
    return;
  }

  // Set the full constellation as selected (renderer uses this)
  AppState.selectedConstellation = constellation;
  showConstellationPanel(constellation, hit.star, hit.alt, hit.az);
}

// ── Constellation panel ────────────────────────────────────────────────────────
/**
 * Populates all three tab panes with constellation lore, then shows the panel.
 * All text is injected upfront so tab switching requires no further work.
 */
function showConstellationPanel(constellation, clickedStar, alt, az) {
  const lore = StarData.getConstellationLore(constellation.name);

  // Header
  el.panelName.textContent = constellation.name;
  const starLabel = clickedStar && clickedStar.name
    ? formatStarName(clickedStar.name)
    : 'unknown star';
  el.panelSub.textContent =
    `Brightest: ${constellation.brightestStar}  |  clicked: ${starLabel}`;

  if (lore) {
    // Myths tab
    el.mythGreek.textContent    = lore.greek;
    el.mythIndian.textContent   = lore.indian;
    el.mythEgyptian.textContent = lore.egyptian;
    el.mythFilipino.textContent = lore.filipino;

    // Science tab
    el.scienceText.textContent = lore.science;

    // Story tab — white-space:pre-line in CSS renders \n as line breaks
    el.storyText.textContent = lore.story;
  } else {
    // Fallback for constellations not yet in the lore database
    const fallback = 'No detailed information available for this constellation yet.';
    el.mythGreek.textContent = el.mythIndian.textContent =
    el.mythEgyptian.textContent = el.mythFilipino.textContent =
    el.scienceText.textContent = el.storyText.textContent = fallback;
  }

  // Always open to the Myths tab when a new constellation is selected
  switchTab('myths');
  el.panel.classList.remove('hidden');
}

/**
 * showUnknownStar: called when a clicked star has no constellation.
 * Shows minimal info without overriding the panel with constellation data.
 */
function showUnknownStar(star, alt, az) {
  el.panelName.textContent = formatStarName(star.name) || 'Unnamed star';
  el.panelSub.textContent  =
    `Magnitude ${star.mag.toFixed(2)}  |  Alt ${alt.toFixed(1)}  Az ${az.toFixed(1)}`;

  const msg = 'This star is not part of a defined constellation in this catalog. ' +
    'Ancient sky-watchers around the world still gave meaning to every star, ' +
    'even those without famous stories.';
  el.mythGreek.textContent = el.mythIndian.textContent =
  el.mythEgyptian.textContent = el.mythFilipino.textContent = msg;
  el.scienceText.textContent =
    `Apparent magnitude: ${star.mag.toFixed(2)}\nPosition: RA ${(star.ra/15).toFixed(3)}h  Dec ${star.dec.toFixed(2)}\nCurrently at altitude ${alt.toFixed(1)}, azimuth ${az.toFixed(1)}`;
  el.storyText.textContent = msg;

  switchTab('myths');
  el.panel.classList.remove('hidden');
}

function closePanel() {
  el.panel.classList.add('hidden');
  AppState.selectedConstellation = null;
  AppState.clickedStar = null;
}

// ── Tab switching ──────────────────────────────────────────────────────────────
/**
 * switchTab(tabName)
 * Activates the named tab pane and its button, deactivates the others.
 * tabName must match a data-tab attribute and a tab-pane id of the form "tab-<name>".
 */
function switchTab(tabName) {
  // Update buttons
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  // Update panes
  document.querySelectorAll('.tab-pane').forEach(pane => {
    pane.classList.toggle('active', pane.id === 'tab-' + tabName);
  });
}

// ── Toggle handler (called from input.js via keyboard) ────────────────────────
function handleToggle(key) {
  if      (key === 'constellations') AppState.showConstellations = !AppState.showConstellations;
  else if (key === 'labels')         AppState.showLabels         = !AppState.showLabels;
  else if (key === 'grid')           AppState.showGrid           = !AppState.showGrid;
  else if (key === 'closePanel')     closePanel();
}

// ── Utility: format catalog star name for display ─────────────────────────────
function formatStarName(name) {
  if (!name || !name.trim()) return null;
  const B = {
    Alp:'α', Bet:'β', Gam:'γ', Del:'δ', Eps:'ε', Zet:'ζ', Eta:'η',
    The:'θ', Iot:'ι', Kap:'κ', Lam:'λ', 'Mu ':'μ', Sig:'σ', Tau:'τ',
    Ups:'υ', Phi:'φ', Chi:'χ', Psi:'ψ', Ome:'ω', 'Pi ':'π',
  };
  let n = name.replace(/^\d+/, '').trim();
  for (const [k, v] of Object.entries(B)) {
    if (n.startsWith(k)) { n = v + ' ' + n.slice(k.length).trim(); break; }
  }
  return n;
}

// ── Start ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', bootstrap);

  </script>
