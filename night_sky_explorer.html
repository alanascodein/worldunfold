<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Sky Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
/*
 * style.css — Night Sky Explorer
 *
 * CHANGES FROM PREVIOUS VERSION:
 *   - Info panel redesigned to support three tabs (Myths, Science, Story)
 *   - Tab button and tab-pane styles added
 *   - Story Mode text gets a slightly different treatment (justified, leading)
 *   - Myth blocks have labelled sections with a subtle left border per culture
 *   - All emoji removed from UI labels per requirements
 *   - Toggle buttons and modal kept intact; minor cleanup
 */


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #000509;
  --accent:       #63d9fa;
  --accent2:      #a78bfa;
  --gold:         #fcd34d;
  --green:        #6ee7b7;
  --panel-bg:     rgba(4,14,28,0.96);
  --panel-border: rgba(99,217,250,0.28);
  --text:         #e2f0ff;
  --text-dim:     #7ba8c8;
  --font-ui:      'Nunito', sans-serif;
  --font-data:    'Space Mono', monospace;
  --r:            12px;
}

html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font-ui); user-select:none; }

/* Canvas */
#skyCanvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
#skyCanvas:active { cursor:grabbing; }

/* HUD */
#hud { position:fixed; top:18px; left:20px; pointer-events:none; z-index:10; }
#hud-title { font-family:var(--font-ui); font-size:14px; font-weight:900; letter-spacing:0.06em; color:var(--accent); text-shadow:0 0 18px rgba(99,217,250,0.5); margin-bottom:6px; }
#hud-info { font-size:11px; font-family:var(--font-data); color:var(--text-dim); line-height:1.9; }

/* Toggle buttons */
#toggles { position:fixed; top:18px; right:20px; z-index:10; display:flex; gap:8px; }
.toggle-btn {
  padding:7px 14px; border-radius:20px; border:1.5px solid var(--panel-border);
  background:rgba(4,14,28,0.8); color:var(--text-dim);
  font-family:var(--font-ui); font-size:12px; font-weight:700;
  cursor:pointer; transition:all 0.2s; backdrop-filter:blur(8px);
}
.toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
.toggle-btn.active { background:rgba(99,217,250,0.12); border-color:var(--accent); color:var(--accent); }

/* Controls legend */
#controls-legend {
  position:fixed; bottom:22px; left:20px; z-index:10; pointer-events:none;
  background:rgba(4,14,28,0.7); border:1px solid var(--panel-border);
  border-radius:var(--r); padding:12px 14px; backdrop-filter:blur(8px);
}
.ctrl-row { font-size:11px; color:var(--text-dim); margin-bottom:5px; display:flex; gap:8px; align-items:center; font-family:var(--font-ui); font-weight:600; }
.ctrl-row:last-child { margin-bottom:0; }
kbd {
  display:inline-block; padding:2px 7px; border:1.5px solid var(--accent); border-radius:5px;
  font-family:var(--font-data); font-size:9px; color:var(--accent);
  background:rgba(99,217,250,0.08); min-width:34px; text-align:center;
}

/* ════════════════════════════════════════════════════════════
   CONSTELLATION INFO PANEL
   Width is fixed at 320px; it scrolls internally within the
   tab content area if text overflows. This keeps the panel
   height predictable and avoids it covering the sky.
   ════════════════════════════════════════════════════════════ */
#info-panel {
  position:fixed; top:50%; right:22px; transform:translateY(-50%);
  width:320px;
  background:var(--panel-bg); border:1.5px solid var(--panel-border);
  border-radius:18px;
  z-index:20; backdrop-filter:blur(16px);
  box-shadow:0 0 50px rgba(99,217,250,0.06), 0 12px 40px rgba(0,0,0,0.9);
  transition:opacity 0.25s, transform 0.25s;
  display:flex; flex-direction:column; max-height:90vh;
  overflow:hidden;
}
#info-panel.hidden { opacity:0; pointer-events:none; transform:translateY(-50%) translateX(24px); }

/* Close button */
#panel-close {
  position:absolute; top:12px; right:14px;
  background:rgba(255,255,255,0.06); border:none; border-radius:6px;
  padding:3px 8px; color:var(--text-dim); cursor:pointer;
  font-family:var(--font-ui); font-size:11px; font-weight:700;
  transition:background 0.2s, color 0.2s;
}
#panel-close:hover { background:rgba(99,217,250,0.15); color:var(--accent); }

/* Panel header: name + subtitle */
#panel-header { padding:20px 20px 0 20px; flex-shrink:0; }
#panel-con-name {
  font-family:var(--font-ui); font-size:20px; font-weight:900;
  color:var(--gold); text-shadow:0 0 20px rgba(252,211,77,0.35);
  margin-bottom:4px; padding-right:44px; /* avoid overlap with close button */
}
#panel-con-subtitle {
  font-size:11px; font-family:var(--font-data); color:var(--text-dim);
  line-height:1.7; margin-bottom:0;
}

/* Tab navigation */
#panel-tabs {
  display:flex; gap:0; margin:14px 20px 0 20px;
  border-bottom:1.5px solid var(--panel-border);
  flex-shrink:0;
}
.tab-btn {
  flex:1; padding:8px 4px; background:none; border:none;
  color:var(--text-dim); font-family:var(--font-ui); font-size:12px; font-weight:700;
  cursor:pointer; letter-spacing:0.04em;
  border-bottom:2px solid transparent; margin-bottom:-1.5px;
  transition:color 0.2s, border-color 0.2s;
}
.tab-btn:hover { color:var(--accent); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

/* Tab pane container — this is what scrolls */
.tab-pane {
  display:none;
  padding:16px 20px 20px 20px;
  overflow-y:auto;
  flex:1;
  /* Custom scrollbar */
  scrollbar-width:thin;
  scrollbar-color:rgba(99,217,250,0.3) transparent;
}
.tab-pane::-webkit-scrollbar { width:4px; }
.tab-pane::-webkit-scrollbar-thumb { background:rgba(99,217,250,0.3); border-radius:2px; }
.tab-pane.active { display:block; }

/* MYTHS TAB */
.myth-block { margin-bottom:16px; }
.myth-block:last-child { margin-bottom:0; }
.myth-label {
  font-size:9px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:5px;
  padding-left:8px; border-left:2.5px solid var(--accent);
}
.myth-text { font-size:12px; font-family:var(--font-ui); font-weight:600; color:var(--text); line-height:1.7; }

/* Culture-specific accent colours on the left border */
.myth-block:nth-child(1) .myth-label { color:#93c5fd; border-left-color:#93c5fd; } /* Greek: blue  */
.myth-block:nth-child(2) .myth-label { color:#fca5a5; border-left-color:#fca5a5; } /* Indian: red  */
.myth-block:nth-child(3) .myth-label { color:#fcd34d; border-left-color:#fcd34d; } /* Egyptian: gold */
.myth-block:nth-child(4) .myth-label { color:#6ee7b7; border-left-color:#6ee7b7; } /* Filipino: green */

/* SCIENCE TAB */
.science-text {
  font-size:12px; font-family:var(--font-ui); font-weight:600;
  color:var(--text); line-height:1.75;
}

/* STORY TAB */
#story-label {
  font-size:9px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--accent2); margin-bottom:12px;
}
.story-text {
  font-size:12.5px; font-family:var(--font-ui); font-weight:600;
  color:var(--text); line-height:1.85;
  /* Preserve paragraph breaks from the \n\n in the story strings */
  white-space:pre-line;
}

/* ════════════════════════════════════════════════════════════
   LOCATION MODAL
   ════════════════════════════════════════════════════════════ */
#location-modal {
  position:fixed; inset:0; background:rgba(0,5,9,0.97);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
#location-modal.hidden { display:none; }
#location-box {
  background:var(--panel-bg); border:1.5px solid var(--panel-border);
  border-radius:22px; padding:44px 48px 40px; min-width:360px; text-align:center;
  box-shadow:0 0 80px rgba(99,217,250,0.08);
}
#location-title { font-family:var(--font-ui); font-size:22px; font-weight:900; color:var(--accent); text-shadow:0 0 24px rgba(99,217,250,0.4); margin-bottom:6px; }
#location-subtitle { font-size:14px; font-weight:600; color:var(--text-dim); margin-bottom:26px; }
.loc-row { margin-bottom:14px; text-align:left; }
.loc-row label { display:block; font-size:11px; font-weight:800; letter-spacing:0.1em; color:var(--accent2); margin-bottom:6px; text-transform:uppercase; }
.loc-row input {
  width:100%; padding:10px 14px;
  background:rgba(255,255,255,0.05); border:1.5px solid var(--panel-border);
  border-radius:10px; color:var(--text); font-family:var(--font-data); font-size:14px;
  outline:none; transition:border-color 0.2s;
}
.loc-row input:focus { border-color:var(--accent); }
#btn-use-gps {
  width:100%; padding:9px; border-radius:10px;
  background:rgba(167,139,250,0.1); border:1.5px dashed var(--accent2);
  color:var(--accent2); font-family:var(--font-ui); font-size:13px; font-weight:700;
  cursor:pointer; transition:background 0.2s;
}
#btn-use-gps:hover { background:rgba(167,139,250,0.2); }
#btn-start {
  margin-top:22px; width:100%; padding:14px; border-radius:12px;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  border:none; color:#000; font-family:var(--font-ui); font-size:15px; font-weight:900;
  cursor:pointer; transition:opacity 0.2s, box-shadow 0.2s;
  box-shadow:0 4px 24px rgba(99,217,250,0.3);
}
#btn-start:hover { opacity:0.88; box-shadow:0 4px 36px rgba(99,217,250,0.5); }
#location-hint { margin-top:10px; font-size:11px; color:var(--text-dim); }

/* ════════════════════════════════════════════════════════════
   LOADING SCREEN
   ════════════════════════════════════════════════════════════ */
#loading-screen {
  position:fixed; inset:0; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200;
}
#loading-screen.hidden { display:none; }
#loading-dots { display:flex; gap:10px; margin-bottom:20px; }
#loading-dots span {
  width:10px; height:10px; border-radius:50%; background:var(--accent);
  animation:blink 1.4s ease-in-out infinite;
}
#loading-dots span:nth-child(2) { animation-delay:0.2s; background:var(--accent2); }
#loading-dots span:nth-child(3) { animation-delay:0.4s; background:var(--gold); }
@keyframes blink { 0%,80%,100%{opacity:0.15;transform:scale(0.8)} 40%{opacity:1;transform:scale(1.3)} }
#loading-text { font-family:var(--font-ui); font-size:14px; font-weight:700; letter-spacing:0.08em; color:var(--text-dim); }

/* ════════════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════════════ */
@media (max-width:600px) {
  #info-panel { width:calc(100vw - 40px); right:20px; top:auto; bottom:16px; transform:none; max-height:60vh; }
  #info-panel.hidden { transform:translateY(20px); }
  #controls-legend { display:none; }
  #toggles { top:auto; bottom:16px; right:20px; }
}

</style>
</head>
<body>
  <canvas id="skyCanvas"></canvas>

  <!-- HUD: top-left time and position readout -->
  <div id="hud">
    <div id="hud-title">Night Sky Explorer</div>
    <div id="hud-info">
      <span id="hud-time"></span><br/>
      <span id="hud-location"></span><br/>
      <span id="hud-view"></span>
    </div>
  </div>

  <!-- Toggle buttons: top-right -->
  <div id="toggles">
    <button class="toggle-btn active" id="btn-constellations"
      onclick="AppState.showConstellations=!AppState.showConstellations;this.classList.toggle('active')">Lines</button>
    <button class="toggle-btn active" id="btn-labels"
      onclick="AppState.showLabels=!AppState.showLabels;this.classList.toggle('active')">Names</button>
    <button class="toggle-btn active" id="btn-grid"
      onclick="AppState.showGrid=!AppState.showGrid;this.classList.toggle('active')">Grid</button>
  </div>

  <!-- Controls legend: bottom-left -->
  <div id="controls-legend">
    <div class="ctrl-row"><kbd>Drag</kbd> Pan sky</div>
    <div class="ctrl-row"><kbd>Arrow</kbd> Pan</div>
    <div class="ctrl-row"><kbd>+ -</kbd> Zoom</div>
    <div class="ctrl-row"><kbd>Click</kbd> Constellation info</div>
  </div>

  <!--
    CONSTELLATION INFO PANEL
    Redesigned from a flat display into a tabbed panel.
    Tabs: Myths (multi-culture) | Science | Story Mode
    The panel is shown/hidden by adding/removing the "hidden" class.
    The active tab is tracked with the "active" class on tab buttons
    and the "active" class on tab content panes.
  -->
  <div id="info-panel" class="hidden">
    <button id="panel-close">close</button>

    <!-- Panel header: constellation name + subtitle -->
    <div id="panel-header">
      <div id="panel-con-name"></div>
      <div id="panel-con-subtitle"></div>
    </div>

    <!-- Tab navigation buttons -->
    <div id="panel-tabs">
      <button class="tab-btn active" data-tab="myths">Myths</button>
      <button class="tab-btn"        data-tab="science">Science</button>
      <button class="tab-btn"        data-tab="story">Story</button>
    </div>

    <!-- Tab content panes -->

    <!-- MYTHS TAB: one section per culture -->
    <div id="tab-myths" class="tab-pane active">
      <div class="myth-block">
        <div class="myth-label">Greek / Roman</div>
        <div class="myth-text" id="myth-greek"></div>
      </div>
      <div class="myth-block">
        <div class="myth-label">Indian</div>
        <div class="myth-text" id="myth-indian"></div>
      </div>
      <div class="myth-block">
        <div class="myth-label">Egyptian</div>
        <div class="myth-text" id="myth-egyptian"></div>
      </div>
      <div class="myth-block">
        <div class="myth-label">Filipino</div>
        <div class="myth-text" id="myth-filipino"></div>
      </div>
    </div>

    <!-- SCIENCE TAB: facts about the constellation -->
    <div id="tab-science" class="tab-pane">
      <div class="science-text" id="science-text"></div>
    </div>

    <!-- STORY TAB: immersive narrative text -->
    <div id="tab-story" class="tab-pane">
      <div id="story-label">Story Mode</div>
      <div class="story-text" id="story-text"></div>
    </div>

  </div>

  <!-- Location prompt modal -->
  <div id="location-modal">
    <div id="location-box">
      <div id="location-title">Night Sky Explorer</div>
      <div id="location-subtitle">Where are you watching the stars from?</div>
      <div class="loc-row">
        <label>Latitude (North +, South -)</label>
        <input id="inp-lat" type="number" step="0.01" value="9.96" />
      </div>
      <div class="loc-row">
        <label>Longitude (East +, West -)</label>
        <input id="inp-lon" type="number" step="0.01" value="76.24" />
      </div>
      <div class="loc-row">
        <button id="btn-use-gps">Find My Location Automatically</button>
      </div>
      <button id="btn-start">Start Exploring the Stars</button>
      <div id="location-hint">Default: Kerala, India</div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-screen" class="hidden">
    <div id="loading-dots"><span></span><span></span><span></span></div>
    <div id="loading-text">Loading star catalog...</div>
  </div>

  /**
 * astroMath.js — Accurate astronomical coordinate transformations
 *
 * ═══════════════════════════════════════════════════════════════════════
 * COORDINATE SYSTEMS
 * ═══════════════════════════════════════════════════════════════════════
 *
 *  1. EQUATORIAL (RA / Dec)
 *     RA  = Right Ascension in DEGREES (0–360) in this catalog.
 *     Dec = Declination, degrees (−90 to +90).
 *
 *  2. HORIZONTAL (Alt / Az)
 *     Alt = Altitude above horizon (0°=horizon, 90°=zenith)
 *     Az  = Azimuth, clockwise from North (0°=N, 90°=E, 180°=S, 270°=W)
 *
 * ═══════════════════════════════════════════════════════════════════════
 * FORMULA CHAIN
 * ═══════════════════════════════════════════════════════════════════════
 *
 *  Julian Date:
 *    JD = (Unix ms / 86400000) + 2440587.5
 *
 *  GMST (compact IAU form):
 *    T    = (JD − 2451545.0) / 36525
 *    GMST = 280.46061837 + 360.98564736629*(JD−2451545)
 *           + 0.000387933*T² − T³/38710000   [degrees]
 *
 *  LST = (GMST + longitude) mod 360
 *
 *  Hour Angle:
 *    HA = LST − RA   [degrees, wrapped to ±180]
 *
 *  Equatorial → Horizontal:
 *    sin(Alt) = sin(φ)·sin(δ) + cos(φ)·cos(δ)·cos(HA)
 *    cos(Az)  = [sin(δ) − sin(Alt)·sin(φ)] / [cos(Alt)·cos(φ)]
 *    Quadrant: if sin(HA)>0, Az = 360−arccos(cosAz)
 *
 *  Gnomonic projection centred on (viewAlt, viewAz):
 *    1. (alt,az) → horizon unit vector (x=East, y=North, z=Up)
 *    2. Rotate: yaw by -viewAz (align view to +Y), pitch by +viewAlt (view becomes +Z)
 *    3. px = cx + (x''/z'')*fovScale,  py = cy − (y''/z'')*fovScale
 */

'use strict';

const AstroMath = (() => {

  const D2R = Math.PI / 180;
  const R2D = 180 / Math.PI;

  function wrap360(deg) { return ((deg % 360) + 360) % 360; }
  function wrap180(deg) { deg = wrap360(deg); return deg > 180 ? deg - 360 : deg; }

  // ── Julian Date ───────────────────────────────────────────────────────
  function julianDate(date) {
    return date.getTime() / 86400000 + 2440587.5;
  }

  // ── GMST in degrees ───────────────────────────────────────────────────
  function gmstDeg(jd) {
    const T = (jd - 2451545.0) / 36525.0;
    const gmst = 280.46061837
               + 360.98564736629 * (jd - 2451545.0)
               + 0.000387933     * T * T
               - (T * T * T)     / 38710000.0;
    return wrap360(gmst);
  }

  // ── Local Sidereal Time in degrees ───────────────────────────────────
  function lstDeg(jd, longitudeDeg) {
    return wrap360(gmstDeg(jd) + longitudeDeg);
  }

  // ── RA/Dec → Alt/Az ───────────────────────────────────────────────────
  function equatorialToHorizontal(raDeg, decDeg, latDeg, jd, lonDeg) {
    const lst = lstDeg(jd, lonDeg);
    const ha  = wrap180(lst - raDeg);   // Hour Angle ±180°

    const H   = ha  * D2R;
    const d   = decDeg * D2R;
    const phi = latDeg * D2R;

    const sinAlt = Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(H);
    const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * R2D;

    const cosAlt = Math.cos(alt * D2R);
    let az = 0;
    if (Math.abs(cosAlt) > 1e-10) {
      const cosAz = (Math.sin(d) - Math.sin(alt * D2R) * Math.sin(phi)) / (cosAlt * Math.cos(phi));
      az = Math.acos(Math.max(-1, Math.min(1, cosAz))) * R2D;
      if (Math.sin(H) > 0) az = 360 - az;
    }

    return { alt, az: wrap360(az) };
  }

  // ── Alt/Az → horizon-frame unit vector ───────────────────────────────
  function altAzToVector(alt, az) {
    const a = alt * D2R, z = az * D2R;
    return {
      x:  Math.cos(a) * Math.sin(z),   // East
      y:  Math.cos(a) * Math.cos(z),   // North
      z:  Math.sin(a)                  // Up
    };
  }

  // ── Gnomonic projection ───────────────────────────────────────────────
  function project(alt, az, viewAlt, viewAz, fovScale, cx, cy) {
    const { x: xh, y: yh, z: zh } = altAzToVector(alt, az);

    // Yaw: rotate −viewAz around Z so view direction aligns to +Y
    const vAz = viewAz * D2R;
    const cosA = Math.cos(vAz), sinA = Math.sin(vAz);
    const xp =  xh * cosA + yh * sinA;
    const yp = -xh * sinA + yh * cosA;
    const zp =  zh;

    // Pitch: rotate +viewAlt around X' so view direction aligns to +Z
    const vAlt = viewAlt * D2R;
    const cosE = Math.cos(vAlt), sinE = Math.sin(vAlt);
    const xpp = xp;
    const ypp = yp * cosE - zp * sinE;
    const zpp = yp * sinE + zp * cosE;

    if (zpp <= 0.001) return { x: 0, y: 0, visible: false };

    const scale = fovScale / zpp;
    return {
      x: cx + xpp * scale,
      y: cy - ypp * scale,
      visible: true
    };
  }

  // ── Inverse projection ────────────────────────────────────────────────
  function screenToAltAz(px, py, viewAlt, viewAz, fovScale, cx, cy) {
    const xpp = (px - cx) / fovScale;
    const ypp = (cy - py) / fovScale;

    const vAlt = viewAlt * D2R;
    const cosE = Math.cos(vAlt), sinE = Math.sin(vAlt);
    const yp =  ypp * cosE + 1.0 * sinE;
    const zp = -ypp * sinE + 1.0 * cosE;
    const xp =  xpp;

    const vAz = viewAz * D2R;
    const cosA = Math.cos(vAz), sinA = Math.sin(vAz);
    const xh = xp * cosA - yp * sinA;
    const yh = xp * sinA + yp * cosA;
    const zh = zp;

    const len = Math.sqrt(xh*xh + yh*yh + zh*zh);
    if (len < 1e-10) return { alt: 0, az: 0 };

    const alt = Math.asin(Math.max(-1, Math.min(1, zh / len))) * R2D;
    const az  = wrap360(Math.atan2(xh, yh) * R2D);
    return { alt, az };
  }

  // ── Magnitude helpers ────────────────────────────────────────────────
  function magToRadius(mag) {
    const minMag = -1.5, maxR = 5.5;
    return Math.max(0.6, Math.min(maxR, maxR * Math.pow(10, -0.2 * (mag - minMag))));
  }

  function magToAlpha(mag) {
    if (mag <= 1) return 1.0;
    if (mag >= 6) return 0.3;
    return 1.0 - 0.14 * (mag - 1);
  }

  return { julianDate, gmstDeg, lstDeg, equatorialToHorizontal,
           project, screenToAltAz, magToRadius, magToAlpha, wrap360, D2R, R2D };
})();

  /**
 * starData.js — Star catalog loading, constellation definitions, and lore
 *
 * ARCHITECTURE NOTE (CHANGE FROM PREVIOUS VERSION):
 *   The information model has shifted from star-centric to constellation-centric.
 *   Previously: clicking a star looked up lore for that specific star.
 *   Now:        clicking a star finds which constellation it belongs to,
 *               then displays that constellation's full information.
 *
 * CONSTELLATION INDICES:

 */

'use strict';

const StarData = (() => {

  let _stars     = [];   // raw catalog array (from EMBEDDED_STARS or fetch)

  // ══════════════════════════════════════════════════════════════════════════
  // CONSTELLATION DEFINITIONS
  //
  // Each entry has:

  //                 and for computing the centroid label position).
  //                 This includes stars referenced in `lines` plus any
  //                 additional members for completeness.
  //   lore        — constellation-level information object (see LORE section)
  //

  // Build a reverse-lookup map: filteredStarIndex → constellation
  // Created once after the constellation array is defined, used by
  // getConstellationForStar() for O(1) lookup at click time.
  const _starToConstellation = new Map();
  for (const con of CONSTELLATIONS) {
    for (const idx of con.stars) {
      // A star could theoretically border two constellations; first match wins
      if (!_starToConstellation.has(idx)) {
        _starToConstellation.set(idx, con);
      }
    }
  }
