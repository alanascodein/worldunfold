<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: white; }
        #globeViz { width: 400px; height: 400px; border: 1px solid white; }
    </style>
</head>
<body>
    <h1>Globe Test</h1>
    <div id="globeViz"></div>
    
    <script type="module">
        try {
            console.log('Testing Three.js basic sphere...');
            
            // Import Three.js
            const { Scene, PerspectiveCamera, WebGLRenderer, SphereGeometry, MeshBasicMaterial, Mesh } = await import('https://esm.sh/three');
            
            const globeEl = document.getElementById('globeViz');
            if (!globeEl) {
                throw new Error('globeViz element not found');
            }
            
            // Create scene
            const scene = new Scene();
            const camera = new PerspectiveCamera(75, 400 / 400, 0.1, 1000);
            const renderer = new WebGLRenderer({ antialias: true });
            
            renderer.setSize(400, 400);
            renderer.setClearColor(0x000000, 0); // Transparent background
            globeEl.appendChild(renderer.domElement);
            
            // Create a simple blue sphere
            const geometry = new SphereGeometry(1, 32, 32);
            const material = new MeshBasicMaterial({ color: 0x0088ff });
            const sphere = new Mesh(geometry, material);
            
            scene.add(sphere);
            camera.position.z = 2;
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                sphere.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            
            animate();
            console.log('Three.js sphere created and animating');
            
        } catch (error) {
            console.error('Error with Three.js:', error);
            document.body.innerHTML += '<p style="color: red;">Three.js Error: ' + error.message + '</p>';
        }
    </script>
</body>
</html>
